name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" "JobAgentGC/1.0"; do
            curl -s -o /tmp/o -m 60 -A "$ua" -w "%{http_code} %{time_total}s %{size_download}\n" https://www.turijobs.com/es/ofertas-trabajo/gran-canaria || echo fail
          done
          curl -s -o /dev/null -m 60 -w "home %{http_code} %{time_total}\n" https://www.turijobs.com/ || echo failhome
          curl -sI -m 30 https://www.turijobs.com/es/ofertas-trabajo/gran-canaria | head -5
