name: Búsqueda diaria de empleo

on:
  schedule:
    # GitHub solo admite horas UTC. Canarias es UTC+0 en invierno y UTC+1 en verano,
    # así que se lanzan dos disparadores y el programa solo ejecuta el que cae a las 08:30 en Canarias.
    # Informe completo de la mañana (08:30 en Canarias). Los dos últimos son respaldo por si GitHub omite alguno:
    # el programa solo envía UN informe al día.
    - cron: "30 7 * * *"    # 08:30 hora canaria en verano
    - cron: "30 8 * * *"    # 08:30 hora canaria en invierno
    - cron: "15 9 * * *"    # respaldo
    - cron: "0 10 * * *"    # respaldo
    # Revisiones de mediodía y tarde: correo solo si hay ofertas nuevas interesantes (con respaldo cada una)
    - cron: "30 13 * * *"
    - cron: "15 14 * * *"
    - cron: "30 19 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "run = búsqueda + informe por correo ahora · manual = búsqueda sin informe (actualiza el panel)"
        default: run
        type: choice
        options: [run, manual]

permissions:
  contents: write
  id-token: write   # identidad de GitHub para enviar el correo a través del panel (sin guardar contraseñas aquí)

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar agente
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          INFOJOBS_CLIENT_ID: ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.modo }}" = "run" ]; then
            python main.py run
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py alerts
          else
            case "${{ github.event.schedule }}" in
              "30 7 * * *"|"30 8 * * *"|"15 9 * * *"|"0 10 * * *") python main.py run --scheduled ;;
              *) python main.py update --scheduled ;;
            esac
          fi

      - name: Guardar historial (base de datos, informes y datos del panel)
        if: always()
        run: |
          git config user.name "job-agent-bot"
          git config user.email "job-agent-bot@users.noreply.github.com"
          git add data/ reports_out/ logs/ site/data.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Actualización automática $(TZ=Atlantic/Canary date '+%Y-%m-%d %H:%M')"
            git pull --rebase -X ours || true
            git push
          fi

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && pytest -q
