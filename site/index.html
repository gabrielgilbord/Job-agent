<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ofertas de empleo · Gran Canaria</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#2b2a28;--muted:#6d6a64;--brand:#1f4e5f;--line:#e2dccf;--ok:#1b7f4c;--good:#2d8f6f;--mid:#c08a1e;--low:#8a8780;--warn:#9a5b00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:18px 20px 16px}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header .sub{opacity:.85;font-size:13px;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 12px;font-size:12px}
.stat b{display:block;font-size:19px}
main{max-width:980px;margin:0 auto;padding:14px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:var(--card);padding:12px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.filters label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
select,input{font:inherit;font-size:14px;padding:7px 8px;border:1px solid #d5cec1;border-radius:8px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
button{font:inherit;font-size:14px;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--brand);color:#fff}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button:disabled{opacity:.5;cursor:default}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.card.fav{box-shadow:0 0 0 2px #e7b93a}
.card.dis{opacity:.5}
.card h3{margin:0 46px 3px 0;font-size:16px;line-height:1.3}
.card h3 a{color:inherit;text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:13px}
.score{position:absolute;right:14px;top:14px;color:#fff;font-weight:700;border-radius:20px;padding:3px 9px;font-size:13px}
.s90{background:var(--ok)}.s80{background:var(--good)}.s70{background:var(--mid)}.s60,.s0{background:var(--low)}
.tags{margin:7px 0 0;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;background:#ece6da}
.tag.st-nueva{background:#d8efe3}.tag.st-modificada,.tag.st-republicada{background:#fde7c4}.tag.st-cerrada{background:#eee;color:#888}
details{margin-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--brand)}
.why{background:#f1f7f4;border-left:3px solid var(--good);padding:7px 9px;border-radius:4px;margin:8px 0}
.warn{color:var(--warn)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;margin-top:6px}
.kv div:nth-child(odd){color:var(--muted)}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.actions button{padding:6px 10px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2b2a28;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;max-width:90vw}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
table.hist{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
table.hist td,table.hist th{padding:6px 8px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<header>
  <h1>Ofertas de empleo · Gran Canaria</h1>
  <div class="sub" id="last">Cargando…</div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div class="filters">
    <label>Buscar<input id="q" placeholder="puesto o empresa"></label>
    <label>Localidad<select id="mun"><option value="">Todas</option></select></label>
    <label>Categoría<select id="cat"><option value="">Todas</option></select></label>
    <label>Estado<select id="st">
      <option value="activas">Activas</option><option value="nuevas">Nuevas / con cambios</option>
      <option value="fav">Favoritas</option><option value="dis">Descartadas</option>
      <option value="cerrada">Cerradas</option><option value="todas">Todo el historial</option></select></label>
    <label>Puntuación mínima<select id="min">
      <option value="0">Cualquiera</option><option value="60" selected>60+</option><option value="70">70+</option>
      <option value="80">80+</option><option value="90">90+</option></select></label>
    <label>Ordenar<select id="ord"><option value="score">Puntuación</option><option value="recent">Más recientes</option>
      <option value="near">Más cercanas</option></select></label>
  </div>
  <div class="row">
    <button id="runBtn">▶ Buscar ahora</button>
    <button class="ghost" id="histBtn">Historial de búsquedas</button>
    <span class="count" id="count"></span>
  </div>
  <div id="hist" style="display:none"></div>
  <div id="list"></div>
</main>
<footer>Actualizado automáticamente cada día a las 08:30 (hora canaria). Las puntuaciones son orientativas; los datos no publicados se indican como «no indicado».</footer>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATA = {offers: [], categories: {}}, FLAGS = {favorite: [], discarded: []};
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
// cambios hechos desde este navegador que aún no se han publicado (la web se regenera en ~1 min)
let PENDING = store.get("pendingFlags", {});

function toast(msg, ms = 3500) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms) }
function fmtDate(iso) { if (!iso) return "desconocida"; const d = new Date(iso.length <= 19 ? iso + (iso.includes("T") ? "" : "T00:00") : iso); return isNaN(d) ? iso.slice(0,10) : d.toLocaleDateString("es-ES", {day:"2-digit", month:"2-digit", year:"numeric"}) }
function fmtDT(iso) { if (!iso) return "—"; const d = new Date(iso); return d.toLocaleString("es-ES", {timeZone:"Atlantic/Canary", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) }
function sc(s) { return s >= 90 ? "s90" : s >= 80 ? "s80" : s >= 70 ? "s70" : s >= 60 ? "s60" : "s0" }
function isFlag(o, f) { const k = o.id + ":" + f; return k in PENDING ? PENDING[k] : FLAGS[f].includes(o.id) }

async function load() {
  const nc = "?t=" + Date.now();
  const [d, f] = await Promise.all([
    fetch("data.json" + nc).then(r => r.ok ? r.json() : {offers: []}).catch(() => ({offers: []})),
    fetch("flags.json" + nc).then(r => r.ok ? r.json() : {}).catch(() => ({}))]);
  DATA = d; FLAGS = {favorite: f.favorite || [], discarded: f.discarded || []};
  // limpiar pendientes ya publicados
  for (const k of Object.keys(PENDING)) { const [id, fl] = k.split(":"); if (FLAGS[fl].includes(+id) === PENDING[k]) delete PENDING[k] }
  store.set("pendingFlags", PENDING);
  const muns = [...new Set(d.offers.map(o => o.municipality || (o.remote ? "Teletrabajo" : "Gran Canaria (sin concretar)")))].sort();
  $("#mun").innerHTML = '<option value="">Todas</option>' + muns.map(m => `<option>${esc(m)}</option>`).join("");
  $("#cat").innerHTML = '<option value="">Todas</option>' + Object.entries(d.categories || {}).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  const lr = d.last_run;
  $("#last").textContent = lr ? `Última búsqueda: ${fmtDT(lr.finished_at)} · ${lr.found} ofertas revisadas` : "Aún no se ha realizado ninguna búsqueda";
  const act = d.offers.filter(o => o.status !== "cerrada");
  $("#stats").innerHTML = [
    [act.length, "ofertas activas"], [act.filter(o => o.score >= 80).length, "muy interesantes (80+)"],
    [act.filter(o => ["nueva","modificada","republicada"].includes(o.status)).length, "nuevas o con cambios"],
    [FLAGS.favorite.length, "favoritas"]].map(([n, t]) => `<div class="stat"><b>${n}</b>${t}</div>`).join("");
  restoreFilters(); render();
}

function place(o) {
  if (o.remote && !o.municipality) return "Teletrabajo";
  return (o.municipality || "Gran Canaria (sin concretar)") + (o.travel_min != null ? ` · ~${o.travel_min} min desde San Mateo` : "");
}

function filtered() {
  const q = $("#q").value.trim().toLowerCase(), mun = $("#mun").value, cat = $("#cat").value, st = $("#st").value, min = +$("#min").value, ord = $("#ord").value;
  let L = DATA.offers.filter(o => {
    if (o.score < min) return false;
    if (cat && o.category !== cat) return false;
    const m = o.municipality || (o.remote ? "Teletrabajo" : "Gran Canaria (sin concretar)");
    if (mun && m !== mun) return false;
    if (q && !(`${o.title} ${o.company}`.toLowerCase().includes(q))) return false;
    const dis = isFlag(o, "discarded"), fav = isFlag(o, "favorite");
    if (st === "activas") return o.status !== "cerrada" && !dis;
    if (st === "nuevas") return ["nueva","modificada","republicada"].includes(o.status) && !dis;
    if (st === "fav") return fav;
    if (st === "dis") return dis;
    if (st === "cerrada") return o.status === "cerrada";
    return true;
  });
  const cmp = {score: (a, b) => b.score - a.score, recent: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || ""),
               near: (a, b) => (a.travel_min ?? 999) - (b.travel_min ?? 999)}[ord];
  return L.sort((a, b) => (isFlag(b, "favorite") - isFlag(a, "favorite")) || cmp(a, b));
}

function render() {
  saveFilters();
  const L = filtered();
  $("#count").textContent = `${L.length} ofertas`;
  if (!L.length) { $("#list").innerHTML = '<div class="empty">No hay ofertas con estos filtros.</div>'; return }
  $("#list").innerHTML = L.map(o => {
    const fav = isFlag(o, "favorite"), dis = isFlag(o, "discarded");
    const chg = o.change_note && o.status !== "comunicada" ? `<span class="tag st-${o.status}">${esc(o.status)}: ${esc(o.change_note)}</span>` : `<span class="tag st-${o.status}">${esc(o.status)}</span>`;
    return `<div class="card ${fav ? "fav" : ""} ${dis ? "dis" : ""}">
      <span class="score ${sc(o.score)}">${o.score}</span>
      <h3><a href="${esc(o.url)}" target="_blank" rel="noopener">${fav ? "★ " : ""}${esc(o.title)}</a></h3>
      <div class="meta">${esc(o.company || "Empresa no indicada")} · ${esc(place(o))}</div>
      <div class="tags"><span class="tag">${esc(DATA.categories[o.category] || "")}</span>${chg}<span class="tag">${esc(o.source)}</span><span class="tag">detectada ${fmtDate(o.first_seen)}</span></div>
      <details><summary>Detalles y valoración</summary>
        <div class="why">${esc(o.verdict)}</div>
        ${(o.warnings || []).map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}
        <div class="kv">
          <div>Salario</div><div>${esc(o.salary_text || "No publicado")}</div>
          <div>Contrato</div><div>${esc(o.contract || "No indicado")}</div>
          <div>Jornada</div><div>${esc(o.workday || "No indicada")}</div>
          <div>Publicada</div><div>${fmtDate(o.published_at)}</div>
          <div>Puntuación</div><div>${Object.entries(o.breakdown || {}).map(([k, v]) => `${esc(k)} ${v}`).join(" · ")}</div>
        </div>
      </details>
      <div class="actions">
        <button onclick="window.open('${esc(o.url)}','_blank')">Ver oferta</button>
        <button class="ghost" onclick="flag(${o.id},'favorite',${!fav})">${fav ? "Quitar favorita" : "☆ Favorita"}</button>
        <button class="ghost" onclick="flag(${o.id},'discarded',${!dis})">${dis ? "Recuperar" : "✕ Descartar"}</button>
      </div></div>`;
  }).join("");
}

function pin() {
  let p = store.get("panelPin", "");
  if (!p) { p = prompt("PIN del panel (solo hace falta la primera vez):") || ""; if (p) store.set("panelPin", p) }
  return p;
}

async function api(body) {
  const p = pin(); if (!p) return null;
  const r = await fetch("/api/accion", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({...body, pin: p})});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { store.set("panelPin", ""); toast("PIN incorrecto"); return null }
  if (!r.ok) { toast("Error: " + (j.error || r.status)); return null }
  return j;
}

async function flag(id, f, value) {
  const k = id + ":" + f, prev = PENDING[k];
  PENDING[k] = value; render();
  const j = await api({accion: "flag", id, flag: f, value});
  if (!j) { if (prev === undefined) delete PENDING[k]; else PENDING[k] = prev; render(); return }
  store.set("pendingFlags", PENDING);
  toast(f === "favorite" ? (value ? "Guardada en favoritas" : "Quitada de favoritas") : (value ? "Oferta descartada" : "Oferta recuperada"));
}

$("#runBtn").onclick = async () => {
  if (!confirm("¿Lanzar una búsqueda ahora? Tarda 2-3 minutos; el panel se actualizará solo después.")) return;
  $("#runBtn").disabled = true;
  const j = await api({accion: "run"});
  if (j) toast("Búsqueda lanzada. Recarga el panel en unos 3 minutos.", 6000);
  setTimeout(() => $("#runBtn").disabled = false, 60000);
  if (!j) $("#runBtn").disabled = false;
};

$("#histBtn").onclick = () => {
  const h = $("#hist");
  if (h.style.display === "none") {
    h.innerHTML = `<table class="hist"><tr><th>Fecha</th><th>Tipo</th><th>Revisadas</th><th>Relevantes</th><th>Nuevas</th><th>Estado</th></tr>` +
      (DATA.runs || []).map(r => `<tr><td>${fmtDT(r.finished_at)}</td><td>${esc({daily:"informe diario", alerts:"revisión de tarde", manual:"manual", preview:"prueba"}[r.mode] || r.mode)}</td><td>${r.found}</td><td>${r.relevant}</td><td>${r.new_count}</td><td>${r.ok ? "✅" : "⚠️"}</td></tr>`).join("") + "</table>";
    h.style.display = "block";
  } else h.style.display = "none";
};

const FIDS = ["q", "mun", "cat", "st", "min", "ord"];
function saveFilters() { store.set("filters", Object.fromEntries(FIDS.map(i => [i, $("#" + i).value]))) }
function restoreFilters() { const f = store.get("filters", {}); for (const i of FIDS) if (f[i] != null && [...($("#" + i).options || [{value: f[i]}])].some(o => o.value === f[i])) $("#" + i).value = f[i] }
FIDS.forEach(i => $("#" + i).addEventListener(i === "q" ? "input" : "change", render));
load();
</script>
</body>
</html>
